version: "3.9"

# NOT VERIFIED - I could not run `docker compose up` in the environment this
# was written in (no Docker daemon, no Maven Central access to build the JARs
# these Dockerfiles need). Review before trusting, especially the startup
# ordering and healthcheck commands.
#
# No YAML anchors/merge keys (<<: *common-env) here on purpose - several
# docker-compose schema validators and some minimal YAML parsers don't
# handle them well and misreport valid syntax as an error. Every service's
# environment is spelled out explicitly instead - more verbose, but works
# everywhere without surprises.
#
# No Redis here - nothing in this codebase has a real use case for it yet
# (see migration doc §20/§28). Add it if/when something actually needs
# shared cache/rate-limit state, not speculatively.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-}
      MYSQL_DATABASE: resume_analyser
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./backend/eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-server:
    build: ./backend/config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      # Absolute path is correct here (unlike the local-dev default) because
      # the volume above mounts config-repo at exactly /config-repo inside
      # the container - see config-server's application.yml comment.
      CONFIG_REPO_LOCATION: file:/config-repo
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build: ./backend/auth-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  resume-service:
    build: ./backend/resume-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  analysis-service:
    build: ./backend/analysis-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  report-service:
    build: ./backend/report-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  job-service:
    build: ./backend/job-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-service:
    build: ./backend/notification-service
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      BREVO_API_KEY: ${BREVO_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api-gateway

volumes:
  mysql-data:
