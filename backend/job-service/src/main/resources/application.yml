server:
  port: ${PORT:8085}

spring:
  application:
    name: job-service

  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}

    cloud:
      config:
        retry:
          max-attempts: 6
          initial-interval: 2000
          max-interval: 10000
          multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: https://eureka-server-ppq0.onrender.com/eureka/
    fetch-registry: true
    register-with-eureka: true

    instance:
      prefer-ip-address: false
      hostname: job-service-oyk8.onrender.com
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
