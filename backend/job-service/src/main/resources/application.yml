server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: job-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  client:
    serviceUrl:
      defaultZone: https://eureka-server-ppq0.onrender.com/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: job-service-90kz.onrender.com
    non-secure-port: 443
    secure-port-enabled: true
    secure-port: 443