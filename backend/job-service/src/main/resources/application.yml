server:
  port: ${PORT:8085}

spring:
  application:
    name: job-service

  # OPTIONAL: the service starts even if the Config Server is asleep or answers 429.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

adzuna:
  app-id: ${ADZUNA_APP_ID}
  app-key: ${ADZUNA_APP_KEY}
  country: ${ADZUNA_COUNTRY:gb}

internal:
  api-key: ${INTERNAL_API_KEY:}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka-server-ppq0.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:job-service-oyk8.onrender.com}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never