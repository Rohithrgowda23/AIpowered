server:
  port: ${PORT:8084}

spring:
  application:
    name: report-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: ${DATABASE_URL}
    username: "${DATABASE_USERNAME:${DB_USERNAME}}"
    password: "${DATABASE_PASSWORD:${DB_PASSWORD}}"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

job-service:
  base-url: ${JOB_SERVICE_URL:http://localhost:8085}

internal:
  api-key: ${INTERNAL_API_KEY}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka-server-ppq0.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:report-service-fvcz.onrender.com}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never