server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/resume_analyser?useSSL=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:2003}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

JWT_SECRET: ${JWT_SECRET}

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

notification-service:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

internal:
  api-key: ${INTERNAL_API_KEY}
