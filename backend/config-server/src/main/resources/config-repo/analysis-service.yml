server:
  port: ${PORT:8083}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

genKey: ${GEMINI_API_KEY}

jwt:
    secret: ${JWT_SECRET}

resume-service:
  base-url: ${RESUME_SERVICE_URL:http://localhost:8082}

report-service:
  base-url: ${REPORT_SERVICE_URL:http://localhost:8084}

internal:
  api-key: ${INTERNAL_API_KEY}