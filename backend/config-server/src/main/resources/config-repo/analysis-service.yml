server:
  port: 8083

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/resume_analyser?useSSL=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:2003}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

genKey: ${GEMINI_API_KEY}

JWT_SECRET: ${JWT_SECRET}

resume-service:
  base-url: ${RESUME_SERVICE_URL:http://localhost:8082}

report-service:
  base-url: ${REPORT_SERVICE_URL:http://localhost:8084}

internal:
  api-key: ${INTERNAL_API_KEY}