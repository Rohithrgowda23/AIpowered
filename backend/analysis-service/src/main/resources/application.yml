server:
  port: ${PORT:8083}

spring:
  application:
    name: analysis-service

  # OPTIONAL: the service starts even if the Config Server is asleep or answers 429.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  datasource:
    url: ${DATABASE_URL}
    username: "${DATABASE_USERNAME:${DB_USERNAME}}"
    password: "${DATABASE_PASSWORD:${DB_PASSWORD}}"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 10000
            read-timeout: 120000   # lets a sleeping service finish waking up

genKey: ${GEMINI_API_KEY}

jwt:
  secret: ${JWT_SECRET}

resume-service:
  base-url: ${RESUME_SERVICE_URL:https://resume-service-d5jv.onrender.com}

report-service:
  base-url: ${REPORT_SERVICE_URL:https://report-service-fvcz.onrender.com}

internal:
  api-key: ${INTERNAL_API_KEY}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka-server-ppq0.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:analysis-service-qf75.onrender.com}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never