server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false

    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 120s

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://auth-service-p0ex.onrender.com}
          predicates:
            - Path=/api/auth/**

        - id: oauth2-authorization
          uri: ${AUTH_SERVICE_URL:https://auth-service-p0ex.onrender.com}
          predicates:
            - Path=/oauth2/**

        - id: oauth2-callback
          uri: ${AUTH_SERVICE_URL:https://auth-service-p0ex.onrender.com}
          predicates:
            - Path=/login/oauth2/**

        # No user-service module exists in the repository; left unchanged.
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: analysis-service
          uri: ${ANALYSIS_SERVICE_URL:https://analysis-service-qf75.onrender.com}
          predicates:
            - Path=/api/analyses/**

        - id: report-service
          uri: ${REPORT_SERVICE_URL:https://report-service-fvcz.onrender.com}
          predicates:
            - Path=/api/reports/**

        - id: job-service
          uri: ${JOB_SERVICE_URL:https://job-service-oyk8.onrender.com}
          predicates:
            - Path=/api/jobs/**

    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka-server-ppq0.onrender.com/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10

  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:api-gateway-tin9.onrender.com}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never