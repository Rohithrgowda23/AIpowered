server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  server:
      enable-self-preservation: true
      eviction-interval-timer-in-ms: 10000
      response-cache-update-interval-ms: 5000