server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eureka-server-ppq0.onrender.com
    prefer-ip-address: false

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: https://eureka-server-ppq0.onrender.com/eureka/

  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 10000
    response-cache-update-interval-ms: 5000